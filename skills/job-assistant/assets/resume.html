<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>简历</title>
<style>
  :root{ --ink:#1a1a1a; --muted:#555; --line:#ddd; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB","Source Han Sans SC",sans-serif;
        color:var(--ink); font-size:11pt; line-height:1.5; }
  .page{ width:210mm; min-height:297mm; padding:16mm 18mm; margin:0 auto; }
  h1{ font-size:20pt; } .subtitle{ color:var(--muted); font-size:10.5pt; margin-top:4px; }
  .section{ margin-top:14px; }
  .section > h2{ font-size:12.5pt; border-bottom:1.5px solid var(--ink); padding-bottom:3px; margin-bottom:8px; break-after:avoid; page-break-after:avoid; }
  .entry{ margin-bottom:10px; break-inside:avoid; page-break-inside:avoid; }
  .entry .row{ display:flex; justify-content:space-between; font-weight:600; }
  .entry .meta{ color:var(--muted); font-weight:400; font-size:10pt; }
  ul{ margin:4px 0 0 18px; } li{ margin:2px 0; }
  @page{ size:A4; margin:0; }
  @media print{ body{ font-size:10.5pt; } .page{ margin:0; } }
</style>
</head>
<body>
  <div class="page">
    <header>
      <h1>姓名</h1>
      <div class="subtitle">求职意向 · 电话 · 邮箱 · 城市</div>
    </header>
    <section class="section"><h2>个人总结</h2><p>按目标轨定制的 2–3 句定位陈述</p></section>
    <section class="section"><h2>工作经历</h2>
      <div class="entry"><div class="row"><span>公司 · 岗位</span><span class="meta">起止时间</span></div>
        <ul><li>动词开头 + 量化结果的经历条目</li></ul></div>
    </section>
    <section class="section"><h2>项目经历</h2>
      <div class="entry"><div class="row"><span>项目名</span><span class="meta">角色 · 时间</span></div>
        <ul><li>可 reframe 朝目标轨的项目条目</li></ul></div>
    </section>
    <section class="section"><h2>专业技能</h2><ul><li>技能分组</li></ul></section>
    <section class="section"><h2>教育背景</h2>
      <div class="entry"><div class="row"><span>学校 · 专业</span><span class="meta">学历 · 时间</span></div></div>
    </section>
  </div>
</body>
</html>
